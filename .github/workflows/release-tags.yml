name: Create React Native SDK tags

on:
  push:
    branches: ['**']

concurrency:
  group: rn-package-release-tags
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    if: >-
      contains(github.event.head_commit.message, '[tag')
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      packages: ${{ steps.plan.outputs.packages }}
      marker: ${{ steps.plan.outputs.marker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'
      - name: Resolve tag marker
        id: plan
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: tool/release_plan.sh >> "$GITHUB_OUTPUT"

  validate:
    needs: plan
    if: needs.plan.outputs.mode == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck selected SDKs
        run: |
          IFS=',' read -r -a packages <<< "${{ needs.plan.outputs.packages }}"
          for package in "${packages[@]}"; do
            (cd "packages/$package" && bun run typecheck)
          done
      - name: Test selected SDKs
        run: |
          IFS=',' read -r -a packages <<< "${{ needs.plan.outputs.packages }}"
          for package in "${packages[@]}"; do
            (cd "packages/$package" && bun run test -- --watchman=false)
          done

  create-tags:
    needs: [plan, validate]
    if: needs.plan.outputs.mode == 'tag'
    # Use the standard Intel hosted runner explicitly. Some accounts resolve macos-14 to an unavailable ARM config.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v4
        if: contains(needs.plan.outputs.packages, 'react-native-gps-tracking')
        with:
          distribution: temurin
          java-version: '17'
      - name: Build GPS TrackingCore XCFramework
        if: contains(needs.plan.outputs.packages, 'react-native-gps-tracking')
        run: tool/build_core.sh release
      - name: Create immutable package tags
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: tool/create_package_tags.sh "${{ needs.plan.outputs.packages }}" "${{ github.sha }}"
      - name: Pack SDKs and create GitHub releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          archive_dir="$RUNNER_TEMP/cua-sdk-tarballs"
          mkdir -p "$archive_dir"
          IFS=',' read -r -a packages <<< "${{ needs.plan.outputs.packages }}"
          for package in "${packages[@]}"; do
            version="$(tool/release_manifest.sh version "$package")"
            tag="${package}_tag-${version}"
            (cd "packages/$package" && bun pm pack --destination "$archive_dir")
            archive="$archive_dir/${package}-${version}.tgz"
            [[ -f "$archive" ]] || {
              echo "Expected package archive was not created: $archive" >&2
              ls -la "$archive_dir" >&2
              exit 1
            }
            gh release create "$tag" "$archive" \
              --title "$package $version" \
              --generate-notes
          done
